name: release-evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-and-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runtime
        run: python -m compileall -q runtime scripts tests
      - name: Run security, recovery, operator, and governance acceptance
        run: bash tests/run.sh
      - name: Build release evidence and SBOM
        run: python scripts/release_evidence.py --output release-evidence
      - name: Confirm unreleased template fails closed
        run: python scripts/release_gate.py --record templates/release-evidence/gate-record.template.json --expect blocked
      - name: Upload immutable job evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

  # The platform this is developed on, and until now the one CI never checked. That is the
  # wrong way round: `filelock.py` carries a whole `msvcrt` branch, the runs directory is
  # walked with Windows path semantics, and every local green suite came from here. Only the
  # acceptance suite runs — release evidence and the SBOM are built once, on Linux, because
  # they describe the artifact rather than the host.
  runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite calls `python3`. On Windows that name is not guaranteed to exist, and where
      # it does it can point at a different interpreter than `python` -- on the development
      # host it resolves to 3.13 while `python` is 3.12. A shim removes the ambiguity, so the
      # suite provably runs on the version this job pinned.
      - name: Point python3 at the interpreter under test
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$HOME/bin/python3"
          chmod +x "$HOME/bin/python3"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Confirm the interpreter
        run: python3 --version
      - name: Compile runtime
        run: python -m compileall -q runtime scripts tests
      - name: Run the acceptance suite on Windows
        run: bash tests/run.sh

  codeql:
    permissions:
      security-events: write
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  control-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Install exact UI dependencies
        run: npm ci --ignore-scripts
      - name: Reject production dependency advisories
        # `npm audit` exits 1 for a real advisory and for its own registry being down, so a
        # 503 at registry.npmjs.org failed the build as though the code were vulnerable.
        # Retry the blip, then read the report instead of the exit code: advisories fail,
        # an unreachable endpoint warns and passes. The gate still rejects every
        # moderate-or-worse advisory it can actually see -- what it must never do is block
        # every merge because somebody else's service had a bad minute.
        run: |
          for attempt in 1 2 3; do
            report=$(npm audit --omit=dev --json 2>/dev/null || true)
            printf '%s' "$report" | grep -q '"metadata"' && break
            echo "::warning::npm audit endpoint unavailable (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          printf '%s' "$report" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              let report;
              try { report = JSON.parse(raw); } catch { report = null; }
              const counts = report && report.metadata && report.metadata.vulnerabilities;
              if (!counts) {
                console.log("::warning::npm audit was unreachable - production advisories were NOT checked on this run");
                return;
              }
              const blocking = (counts.moderate || 0) + (counts.high || 0) + (counts.critical || 0);
              if (blocking) {
                console.error(`${blocking} production advisories at moderate or above: ${JSON.stringify(counts)}`);
                console.error("run: npm audit --omit=dev");
                process.exitCode = 1;
                return;
              }
              console.log("no production advisories at moderate or above");
            });
          '
      - name: Lint, build, render-test, and validate artifact
        run: npm run lint && npm test && npm run validate:artifact
