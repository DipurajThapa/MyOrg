name: release-evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-and-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runtime
        run: python -m compileall -q runtime scripts tests
      - name: Run security, recovery, operator, and governance acceptance
        run: bash tests/run.sh
      - name: Build release evidence and SBOM
        run: python scripts/release_evidence.py --output release-evidence
      - name: Confirm unreleased template fails closed
        run: python scripts/release_gate.py --record templates/release-evidence/gate-record.template.json --expect blocked
      - name: Upload immutable job evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

  codeql:
    permissions:
      security-events: write
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  control-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Install exact UI dependencies
        run: npm ci --ignore-scripts
      - name: Reject production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Lint, build, render-test, and validate artifact
        run: npm run lint && npm test && npm run validate:artifact
