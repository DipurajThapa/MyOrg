groups:
  - name: myorg-runtime
    rules:
      - alert: MyOrgRuntimeUnavailable
        expr: up{job="myorg-runtime"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: MyOrg runtime cannot be scraped
          runbook: docs/OPERATIONS-RUNBOOK.md#runtime-unavailable
      - alert: MyOrgServerErrorRate
        expr: sum(rate(myorg_http_requests_total{job="myorg-runtime",status=~"5.."}[5m])) / clamp_min(sum(rate(myorg_http_requests_total{job="myorg-runtime"}[5m])), 0.001) > 0.02
        for: 10m
        labels: { severity: high }
        annotations:
          summary: MyOrg 5xx ratio exceeds 2 percent
          runbook: docs/OPERATIONS-RUNBOOK.md#elevated-errors
      - alert: MyOrgAuthorizationDenials
        expr: sum(increase(myorg_http_requests_total{job="myorg-runtime",status=~"401|403"}[10m])) > 25
        for: 5m
        labels: { severity: medium }
        annotations:
          summary: MyOrg authorization denials exceed baseline threshold
          runbook: docs/OPERATIONS-RUNBOOK.md#authorization-denials

  # The autonomous half. Everything above watches the web server -- the one part of this
  # company that is not autonomous. These four watch the part that is, which is the part
  # that runs while nobody is looking.
  - name: myorg-autonomy
    rules:
      - alert: MyOrgOutwardCallUnresolved
        # The most serious of the four. A call left this host and never came back, so
        # nobody knows whether it took effect. The runtime will not retry it -- by design --
        # so it waits for a person, and if no person comes it waits forever.
        expr: myorg_connector_receipt_unsettled_seconds_max{job="myorg-runtime"} > 900
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: An outward call has been unresolved for over 15 minutes
          description: Reconcile it against the provider, then POST /v1/connector-receipts/{id}/reconciliation.
          runbook: docs/TRIGGERS-AND-LIVE-CONNECTORS.md#the-three-outcomes

      - alert: MyOrgApprovalUnanswered
        # Work has stopped and is waiting on a person. Silence here is indistinguishable
        # from "nothing to do" without this alert.
        expr: myorg_approval_wait_seconds_max{job="myorg-runtime"} > 14400
        for: 15m
        labels: { severity: high }
        annotations:
          summary: A decision has been waiting on a human for over 4 hours
          runbook: docs/OPERATIONS-RUNBOOK.md#approvals-waiting

      - alert: MyOrgTriggerQueueBacklog
        # Work is arriving faster than it is being planned. At 50 the queue refuses new
        # work, so this fires well before anything is dropped.
        expr: myorg_trigger_queue_depth{job="myorg-runtime"} > 20
        for: 10m
        labels: { severity: high }
        annotations:
          summary: Triggered work is queueing faster than the scheduler plans it
          description: Check the scheduler is running -- systemctl status myorg-scheduler.
          runbook: docs/TRIGGERS-AND-LIVE-CONNECTORS.md#running-the-loop-as-a-service

      - alert: MyOrgRunsStalled
        expr: myorg_runs{job="myorg-runtime",state="stalled"} > 0
        for: 30m
        labels: { severity: medium }
        annotations:
          summary: A run can no longer move and is not waiting on anybody
          runbook: docs/OPERATIONS-RUNBOOK.md#stalled-runs

      - alert: MyOrgRunSpendHigh
        # The ceiling parks a run at $5 by default, so this fires while there is still room
        # to look rather than after the stop. A run costing this much is usually a retry
        # loop, not unusually hard work.
        expr: myorg_spend_usd_worst_run{job="myorg-runtime"} > 3
        for: 5m
        labels: { severity: medium }
        annotations:
          summary: A single run has spent more than $3
          description: Check for a step failing its acceptance criteria repeatedly; each retry is a full dispatch plus a grading pass.
          runbook: docs/OPERATIONS-RUNBOOK.md#a-run-is-spending-too-much

      - alert: MyOrgTotalSpendHigh
        # B-05a. The per-run ceiling bounds one run; nothing bounds runs × ceiling. This is
        # the fleet number, watched before anyone decides whether it needs enforcing. The
        # threshold is a placeholder until a week of data says what normal is.
        expr: myorg_spend_usd_total{job="myorg-runtime"} > 25
        for: 5m
        labels: { severity: medium }
        annotations:
          summary: The runs on this host have spent more than $25 in total
          description: Read the per-run figures; if many small runs add up, that is the schedule, not a bug. Suspend the organization to stop new work.
          runbook: docs/OPERATIONS-RUNBOOK.md#a-run-is-spending-too-much

      - alert: MyOrgOrganizationSuspended
        # B-03. A suspended company starts nothing and admits nobody. That is sometimes
        # exactly what an operator wants for an hour -- and never what they want to forget.
        expr: myorg_org_suspended{job="myorg-runtime"} == 1
        for: 6h
        labels: { severity: medium }
        annotations:
          summary: The organization has been suspended for over 6 hours
          runbook: docs/OPERATIONS-RUNBOOK.md#pausing-the-company

      - alert: MyOrgConnectorAuthorizationExpiring
        # Access dies at a moment nobody chose, mid-run, and the failure looks like a bug.
        # Fourteen days is enough to get a human through an OAuth flow without urgency.
        expr: myorg_connector_authorization_expires_seconds{job="myorg-runtime"} < 1209600
        for: 1h
        labels: { severity: medium }
        annotations:
          summary: A connector authorization expires within 14 days
          description: Re-authorize it before it lapses; once it does, every write through that connector is refused.
          runbook: docs/TRIGGERS-AND-LIVE-CONNECTORS.md#live-connectors--reaching-a-real-system

      - alert: MyOrgAutonomyMetricsBlind
        # The watchers stopped watching. Without this, every alert above would go quiet
        # for the same reason a healthy company does -- which is the failure mode this
        # whole group exists to prevent.
        expr: myorg_runtime_snapshot_ok{job="myorg-runtime"} == 0
        for: 10m
        labels: { severity: high }
        annotations:
          summary: MyOrg cannot read its own autonomous state; the alerts above are blind
          runbook: docs/OPERATIONS-RUNBOOK.md#runtime-unavailable
